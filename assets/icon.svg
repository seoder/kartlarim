<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#0B0C0E"/>
  <!-- Card outline with rounded corners -->
  <rect x="232" y="335" width="560" height="354" rx="44" ry="44" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/>
