  <rect x="300" y="440" width="100" height="74" rx="14" ry="14" fill="none" stroke="#FFFFFF" stroke-width="18" opacity="0.85"/>
  <line x1="300" y1="477" x2="400" y2="477" stroke="#FFFFFF" stroke-width="14" opacity="0.85"/>
  <!-- Minimalist card number bars -->
  <circle cx="316" cy="590" r="14" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="360" cy="590" r="14" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="404" cy="590" r="14" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="448" cy="590" r="14" fill="#FFFFFF" opacity="0.9"/>
  <line x1="520" y1="590" x2="720" y2="590" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
</svg>
